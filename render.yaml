services:
  # Backend API Server
  - type: web
    name: bennco-advisors-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
    healthCheckPath: /api/health

