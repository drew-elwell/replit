<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sunsetSkyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#FFE66D;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#45B7D1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5A4A3A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7A6545;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A3A2A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountainGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6A5535;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A2A1A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Sunset Sky -->
  <rect width="400" height="400" fill="url(#sunsetSkyGrad)"/>
  
  <!-- Sun -->
  <circle cx="320" cy="100" r="30" fill="#FFE66D" opacity="0.9"/>
  <circle cx="320" cy="100" r="35" fill="#FFE66D" opacity="0.3"/>
  
  <!-- Mountain layers (furthest to nearest) -->
  <!-- Back mountains -->
  <polygon points="0,250 100,150 200,180 300,120 400,160 400,400 0,400" fill="url(#mountainGrad1)" opacity="0.7"/>
  
  <!-- Middle mountains -->
  <polygon points="0,300 80,200 180,220 280,180 380,200 400,220 400,400 0,400" fill="url(#mountainGrad2)" opacity="0.8"/>
  
  <!-- Front mountains -->
  <polygon points="0,350 60,280 140,300 220,250 300,280 400,260 400,400 0,400" fill="url(#mountainGrad3)"/>
  
  <!-- Snow caps on peaks -->
  <polygon points="100,150 130,170 170,180 130,150 100,150" fill="white" opacity="0.8"/>
  <polygon points="300,120 330,140 360,160 330,120 300,120" fill="white" opacity="0.8"/>
  <polygon points="220,250 240,260 260,270 240,250 220,250" fill="white" opacity="0.6"/>
  
  <!-- Pine trees silhouettes -->
  <g transform="translate(50, 380)">
    <polygon points="0,-30 -8,-5 8,-5" fill="#1a3d1a"/>
    <polygon points="0,-20 -6,-2 6,-2" fill="#1a3d1a"/>
    <rect x="-1" y="-2" width="2" height="8" fill="#4a2c2a"/>
  </g>
  
  <g transform="translate(120, 390)">
    <polygon points="0,-25 -6,-3 6,-3" fill="#1a3d1a"/>
    <rect x="-1" y="-3" width="2" height="6" fill="#4a2c2a"/>
  </g>
  
  <g transform="translate(350, 375)">
    <polygon points="0,-35 -10,-8 10,-8" fill="#1a3d1a"/>
    <polygon points="0,-25 -8,-5 8,-5" fill="#1a3d1a"/>
    <rect x="-1" y="-5" width="2" height="10" fill="#4a2c2a"/>
  </g>
  
  <!-- Birds in sky -->
  <path d="M150,80 Q155,85 160,80 Q165,75 170,80" fill="none" stroke="#333" stroke-width="1"/>
  <path d="M180,90 Q185,95 190,90 Q195,85 200,90" fill="none" stroke="#333" stroke-width="1"/>
  
  <!-- Clouds -->
  <ellipse cx="80" cy="60" rx="20" ry="8" fill="white" opacity="0.6"/>
  <ellipse cx="90" cy="55" rx="15" ry="6" fill="white" opacity="0.6"/>
  <ellipse cx="250" cy="70" rx="25" ry="10" fill="white" opacity="0.4"/>
</svg>